name = "karaweb-turnstile-proxy"
main = "src/index.js"
compatibility_date = "2026-05-19"

# The Worker is reachable at its default workers.dev URL:
#   https://karaweb-turnstile-proxy.bakerpd.workers.dev
# That's the URL baked into both backend scripts and is good enough
# for production. No custom-domain route is needed unless you ever
# migrate classinteractives.co.uk's DNS onto Cloudflare — in which
# case you'd add a [[routes]] block here, e.g.:
#   [[routes]]
#   pattern   = "karaweb.classinteractives.co.uk/api/verify-turnstile"
#   zone_name = "classinteractives.co.uk"

# Workers Logs (last 30 days, useful for debugging Turnstile rejections).
[observability]
enabled = true

# The Turnstile secret is set via:
#   wrangler secret put TURNSTILE_SECRET_KEY
# It will appear in the dashboard but never in this file.
# (You set it via the Cloudflare dashboard's "Variables and Secrets"
# UI — the wrangler CLI is just an alternative, you don't need it.)
